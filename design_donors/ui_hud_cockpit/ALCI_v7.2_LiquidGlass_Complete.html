<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CogOS ALCI v7.2 — Liquid Glass + Aero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-base: rgba(45, 16, 63, 0.35);
      --glass-edge: rgba(255, 255, 255, 0.12);
      --glass-inner-glow: rgba(181, 140, 255, 0.08);
      --highlight: #6A3CB8;
      --internal-glow: #B58CFF;
      --active-accent: #8F54ED;
      --pale-orchid: #F0EAFF;
      --c-mode: #44FF88;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 40%, #2a1045 0%, #0a0510 100%);
      overflow: hidden;
      color: var(--pale-orchid);
      cursor: grab;
    }

    body.dragging { cursor: grabbing; }

    /* ========================================
       HOLOFONT TEXT PROJECTION SYSTEM
       Text floats ABOVE glass, casts shadow DOWN
       ======================================== */
    .holofont {
      color: var(--pale-orchid);
      /* Key: shadow goes DOWN onto glass below */
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.4),
        0 4px 8px rgba(0, 0, 0, 0.2);
      /* Slight text glow for projection feel */
      filter: drop-shadow(0 0 1px rgba(240, 234, 255, 0.3));
    }

    .holofont-header {
      font-weight: 600;
      text-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .holofont:hover {
      text-shadow: 
        0 3px 6px rgba(0, 0, 0, 0.5),
        0 6px 12px rgba(0, 0, 0, 0.25);
    }

    /* ========================================
       BOKEH & BACKGROUND
       ======================================== */
    .bokeh {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bokeh-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 206, 209, 0.25) 0%, transparent 60%);
      top: -5%;
      left: 5%;
      filter: blur(80px);
    }

    .bokeh-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 206, 209, 0.2) 0%, transparent 60%);
      bottom: 10%;
      right: -5%;
      filter: blur(70px);
    }

    .bokeh-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(143, 84, 237, 0.2) 0%, transparent 60%);
      top: 30%;
      left: 50%;
      filter: blur(60px);
    }

    .bokeh-4 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(181, 140, 255, 0.15) 0%, transparent 60%);
      bottom: 30%;
      left: 20%;
      filter: blur(50px);
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 50%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 30% 70%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 30%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 75% 55%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 40%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 25%, rgba(255,255,255,0.3) 0%, transparent 100%);
    }

    /* Title */
    .title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.5;
      text-transform: lowercase;
      z-index: 100;
    }

    /* ========================================
       CAROUSEL SYSTEM
       ======================================== */
    .carousel-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      z-index: 10;
    }

    .sphere-origin {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* ========================================
       LIQUID GLASS PANEL MATERIAL
       Apple Liquid Glass + Windows Aero
       ======================================== */
    .panel {
      position: absolute;
      transform-style: preserve-3d;
      transition: opacity 0.3s ease-out, filter 0.3s ease-out;
    }

    .panel-inner {
      position: relative;
      /* GLASS: High blur, low opacity base */
      background: linear-gradient(
        135deg,
        rgba(60, 30, 90, 0.45) 0%,
        rgba(40, 15, 65, 0.35) 50%,
        rgba(50, 25, 80, 0.4) 100%
      );
      backdrop-filter: blur(40px) saturate(1.4);
      -webkit-backdrop-filter: blur(40px) saturate(1.4);
      border-radius: 16px;
      overflow: hidden;
      cursor: default;

      /* AERO: Multi-layer border for wet glass edge */
      border: 1px solid rgba(255, 255, 255, 0.15);
      
      /* LIQUID GLASS: Complex shadow for depth + internal glow */
      box-shadow: 
        /* Outer shadow for depth */
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.3),
        /* Top edge highlight (wet glass) */
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        /* Left edge highlight */
        inset 1px 0 0 rgba(255, 255, 255, 0.1),
        /* Internal luminescence - the trapped light */
        inset 0 0 80px rgba(181, 140, 255, 0.06),
        inset 0 0 40px rgba(143, 84, 237, 0.04);
    }

    /* Glass sheen overlay - the "wet" reflection */
    .panel-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.02) 40%,
        transparent 100%
      );
      pointer-events: none;
      border-radius: 16px 16px 0 0;
    }

    /* Focused panel gets cognitive corona */
    .panel.focused .panel-inner {
      border-color: rgba(143, 84, 237, 0.4);
      box-shadow: 
        /* Corona glow */
        0 0 60px 15px rgba(143, 84, 237, 0.2),
        0 0 100px 30px rgba(106, 60, 184, 0.1),
        /* Depth shadows */
        0 12px 48px rgba(0, 0, 0, 0.5),
        0 4px 16px rgba(0, 0, 0, 0.3),
        /* Enhanced edge highlights */
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 1px 0 0 rgba(255, 255, 255, 0.15),
        /* Brighter internal luminescence */
        inset 0 0 100px rgba(181, 140, 255, 0.1),
        inset 0 0 50px rgba(143, 84, 237, 0.06);
    }

    /* ========================================
       WINDOW HEADER
       ======================================== */
    .window-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      /* Header has slight glass tint */
      background: rgba(255, 255, 255, 0.03);
    }

    .window-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(181, 140, 255, 0.5);
      box-shadow: 0 0 4px rgba(181, 140, 255, 0.3);
    }

    .window-dot.green {
      background: var(--c-mode);
      box-shadow: 0 0 8px rgba(68, 255, 136, 0.5);
    }

    .panel-content {
      padding: 16px;
      overflow-y: auto;
      max-height: calc(100% - 48px);
    }

    /* ========================================
       CONTENT STYLES
       ======================================== */
    .cil-list-title { 
      font-size: 12px; 
      font-weight: 600; 
      margin-bottom: 12px; 
    }

    .cil-item { 
      padding: 10px 12px; 
      margin-bottom: 6px; 
      /* Item cards are slightly more opaque */
      background: rgba(26, 10, 46, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 8px; 
      border-left: 2px solid rgba(181, 140, 255, 0.4); 
      font-size: 10px;
      transition: all 0.15s ease-out;
    }

    .cil-item:hover {
      background: rgba(40, 20, 70, 0.5);
      border-left-color: rgba(181, 140, 255, 0.7);
    }

    .cil-item-id { 
      font-weight: 600; 
      font-family: 'JetBrains Mono', monospace; 
      margin-bottom: 2px; 
    }

    .cil-item-meta { 
      opacity: 0.5; 
      font-size: 9px; 
    }

    .stack-title { 
      font-size: 16px; 
      font-weight: 700; 
      margin-bottom: 16px; 
      letter-spacing: 1px; 
    }

    .stack-diagram { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 8px; 
    }

    .stack-row { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
    }

    .stack-box { 
      padding: 8px 16px; 
      background: rgba(26, 10, 46, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(181, 140, 255, 0.3); 
      border-radius: 6px; 
      font-size: 10px; 
      font-weight: 500; 
      text-align: center; 
      min-width: 80px;
      transition: all 0.15s ease-out;
    }

    .stack-box:hover {
      background: rgba(40, 20, 70, 0.6);
      border-color: rgba(181, 140, 255, 0.5);
    }

    .stack-box.primary { 
      background: rgba(106, 60, 184, 0.35);
      border-color: rgba(143, 84, 237, 0.6); 
    }

    .stack-box.success { 
      border-color: var(--c-mode); 
      box-shadow: 0 0 12px rgba(68, 255, 136, 0.25); 
    }

    .stack-connector { 
      width: 1px; 
      height: 20px; 
      background: rgba(181, 140, 255, 0.3); 
    }

    .stack-connector-h { 
      width: 30px; 
      height: 1px; 
      background: rgba(181, 140, 255, 0.3); 
    }

    .cil-data { 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 12px; 
      line-height: 1.8; 
    }

    .cil-entry { margin-bottom: 4px; }
    .cil-key { color: rgba(181, 140, 255, 0.8); }
    .cil-value { color: var(--pale-orchid); }
    .cil-section { 
      margin-top: 12px; 
      padding-top: 8px; 
      border-top: 1px solid rgba(181, 140, 255, 0.15); 
    }

    .merkle-panel { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding-top: 24px; 
    }

    .merkle-title { 
      font-size: 10px; 
      letter-spacing: 1px; 
      opacity: 0.6; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
    }

    .merkle-percent { 
      font-size: 28px; 
      font-weight: 600; 
      opacity: 0.5; 
      margin-bottom: 24px; 
    }

    .helix-visual { 
      position: relative; 
      width: 70px; 
      height: 280px; 
    }

    .helix-node { 
      position: absolute; 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      background: var(--internal-glow); 
      opacity: 0.2; 
      transition: all 0.2s ease-out;
      box-shadow: 0 0 4px rgba(181, 140, 255, 0.2);
    }

    .helix-node.active { 
      opacity: 0.9; 
      box-shadow: 0 0 16px 4px rgba(181, 140, 255, 0.5);
      transform: scale(1.2);
    }

    .helix-connector { 
      position: absolute; 
      height: 1px; 
      background: linear-gradient(90deg, 
        rgba(181, 140, 255, 0.1),
        rgba(181, 140, 255, 0.25),
        rgba(181, 140, 255, 0.1)
      ); 
    }

    .status-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 10px; 
    }

    .status-card { 
      background: rgba(26, 10, 46, 0.4);
      backdrop-filter: blur(8px);
      border-radius: 8px; 
      padding: 12px; 
      border: 1px solid rgba(181, 140, 255, 0.2);
      transition: all 0.15s ease-out;
    }

    .status-card:hover {
      background: rgba(40, 20, 70, 0.5);
      border-color: rgba(181, 140, 255, 0.4);
    }

    .status-label { 
      font-size: 10px; 
      opacity: 0.6; 
      margin-bottom: 4px; 
    }

    .status-value { 
      font-size: 22px; 
      font-weight: 600; 
    }

    /* ========================================
       HOLORIBBON - Bottom Navigation
       ======================================== */
    .holo-ribbon {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      padding: 10px 24px;
      gap: 18px;
      z-index: 100;
      
      /* Glass material for ribbon */
      background: linear-gradient(
        135deg,
        rgba(50, 25, 75, 0.7) 0%,
        rgba(40, 15, 60, 0.6) 100%
      );
      backdrop-filter: blur(30px) saturate(1.3);
      -webkit-backdrop-filter: blur(30px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 0 40px rgba(181, 140, 255, 0.05);
    }

    /* Ribbon sheen */
    .holo-ribbon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.06) 0%,
        transparent 100%
      );
      border-radius: 16px 16px 0 0;
      pointer-events: none;
    }

    .ribbon-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--active-accent), var(--highlight));
      animation: orb-pulse 2s ease-in-out infinite;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(143, 84, 237, 0.5);
    }

    @keyframes orb-pulse {
      0%, 100% { box-shadow: 0 0 15px 5px rgba(143, 84, 237, 0.5); }
      50% { box-shadow: 0 0 25px 8px rgba(143, 84, 237, 0.6); }
    }

    .ribbon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 500;
      color: var(--pale-orchid);
      cursor: pointer;
      transition: all 0.15s ease-out;
    }

    .ribbon-btn:hover { 
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .heartbeat { 
      display: flex; 
      gap: 5px; 
      align-items: center; 
    }

    .heartbeat-dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: var(--internal-glow); 
      opacity: 0.3; 
      transition: all 0.15s ease-out; 
    }

    .heartbeat-dot.active { 
      opacity: 1; 
      box-shadow: 0 0 10px 3px rgba(181, 140, 255, 0.6);
      transform: scale(1.1);
    }

    .ribbon-divider { 
      width: 1px; 
      height: 24px; 
      background: rgba(255, 255, 255, 0.1); 
    }

    .gov-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(68, 255, 136, 0.12);
      border: 1px solid rgba(68, 255, 136, 0.35);
      color: var(--c-mode);
    }

    .gov-badge-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: var(--c-mode);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #000;
    }

    .cil-status { 
      font-size: 11px; 
      opacity: 0.7; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }

    .cil-status-dot { 
      width: 6px; 
      height: 6px; 
      border-radius: 50%; 
      background: var(--c-mode);
      box-shadow: 0 0 6px rgba(68, 255, 136, 0.5);
    }

    .cogos-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease-out;
      box-shadow: 0 0 15px rgba(143, 84, 237, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cogos-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(143, 84, 237, 0.6);
    }

    .cogos-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Panel indicators */
    .panel-indicators {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 50;
    }

    .panel-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(181, 140, 255, 0.25);
      cursor: pointer;
      transition: all 0.2s ease-out;
      box-shadow: 0 0 4px rgba(181, 140, 255, 0.2);
    }

    .panel-indicator.active {
      background: var(--internal-glow);
      box-shadow: 0 0 12px rgba(181, 140, 255, 0.6);
      transform: scale(1.2);
    }

    .panel-indicator:hover { 
      background: rgba(181, 140, 255, 0.5); 
    }

    .watermark {
      position: fixed;
      bottom: 100px;
      right: 30px;
      font-size: 28px;
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="bokeh bokeh-1"></div>
  <div class="bokeh bokeh-2"></div>
  <div class="bokeh bokeh-3"></div>
  <div class="bokeh bokeh-4"></div>

  <div class="title holofont">cogos alci v7.2 — aero-liquid cognitive interface</div>

  <div class="carousel-container" id="carousel">
    <div class="sphere-origin" id="sphereOrigin"></div>
  </div>

  <div class="panel-indicators" id="indicators"></div>

  <!-- HoloRibbon with Shugo -->
  <div class="holo-ribbon">
    <div class="ribbon-orb"></div>
    <button class="ribbon-btn holofont">Query</button>
    <button class="ribbon-btn holofont">Map</button>
    <button class="ribbon-btn holofont">Map</button>
    <button class="ribbon-btn holofont">Simulate</button>
    <div class="ribbon-divider"></div>
    <div class="heartbeat" id="heartbeat">
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot active"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
      <div class="heartbeat-dot"></div>
    </div>
    <div class="ribbon-divider"></div>
    <div class="gov-badge">
      <div class="gov-badge-icon">C</div>
      <span class="holofont">snvε</span>
    </div>
    <div class="cil-status holofont">
      <div class="cil-status-dot"></div>
      cil
    </div>
    <div class="ribbon-divider"></div>
    <div class="cogos-icon" id="cogosIcon" title="CogOS">
      <img id="cogosImg" alt="CogOS" />
    </div>
  </div>

  <div class="watermark">✦</div>

  <script>
    // Panel definitions
    const panels = [
      {
        id: 'status',
        title: 'System Status',
        width: 280,
        height: 220,
        content: `
          <div class="status-grid">
            <div class="status-card"><div class="status-label holofont">α (Confidence)</div><div class="status-value holofont">0.72</div></div>
            <div class="status-card"><div class="status-label holofont">β (Evidence)</div><div class="status-value holofont">0.89</div></div>
            <div class="status-card"><div class="status-label holofont">ΔU (Drift)</div><div class="status-value holofont">0.08</div></div>
            <div class="status-card"><div class="status-label holofont">TAU</div><div class="status-value holofont">-0.5</div></div>
          </div>
        `
      },
      {
        id: 'cil-list',
        title: 'Liquid shelf',
        width: 240,
        height: 420,
        content: `
          <div class="cil-list-title holofont">CIL NODE LIST</div>
          <div class="cil-item"><div class="cil-item-id holofont">BLOCK_001</div><div class="cil-item-meta holofont">Created: 2024-12-03</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">DELTA_UPDATE</div><div class="cil-item-meta holofont">Changed: config.threshold</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">BRANCH_DIVERGE</div><div class="cil-item-meta holofont">Competing: 3 hypotheses</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">MERGE_COMPLETE</div><div class="cil-item-meta holofont">Result: consilience_merge</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">CACHE_REFRESH</div><div class="cil-item-meta holofont">Cleared: 847 entries</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">HANDLER_INIT</div><div class="cil-item-meta holofont">Status: READY</div></div>
          <div class="cil-item"><div class="cil-item-id holofont">STATE_MARK</div><div class="cil-item-meta holofont">Merkle: 0x7f3a...</div></div>
        `
      },
      {
        id: 'cognitive-stack',
        title: 'Cognitive corona',
        width: 360,
        height: 440,
        content: `

    const SPHERE_RADIUS = 750;

    const MAX_LEFT_ANGLE = -75;
    const MAX_RIGHT_ANGLE = 45;
    
    let currentOffset = 0;
    let targetOffset = 0;
    let isDragging = false;
    let startX = 0;

    const sphereOrigin = document.getElementById('sphereOrigin');

      panels.forEach((panel, index) => {
        const el = document.createElement('div');
        el.className = 'panel';
        el.id = `panel-${panel.id}`;
        el.innerHTML = `
          <div class="panel-inner" style="width: ${panel.width}px; height: ${panel.height}px;">

              <span>${panel.title}</span>
            </div>
            <div class="panel-content">${panel.content}</div>
          </div>
        `;
        sphereOrigin.appendChild(el);

        const indicator = document.createElement('div');
        indicator.className = 'panel-indicator';
        indicator.dataset.index = index;
        indicator.addEventListener('click', () => snapToPanel(index));
        indicatorsContainer.appendChild(indicator);
      });
    }

    function updatePanels() {
      const panelElements = document.querySelectorAll('.panel');
      const indicators = document.querySelectorAll('.panel-indicator');
      
      panelElements.forEach((el, index) => {
        const baseAngle = index * ANGLE_SPACING;
        const angle = baseAngle + currentOffset;
        const rad = (angle * Math.PI) / 180;
        
        const x = Math.sin(rad) * SPHERE_RADIUS;
        const z = Math.cos(rad) * SPHERE_RADIUS - SPHERE_RADIUS;
        const rotY = -angle;
        
        let opacity = 1;
        let blur = 0;
        let isFocused = false;
        
        // Right side fades out
        if (angle > 12) {
          opacity = Math.max(0, 1 - (angle - 12) / 33);
          blur = Math.min(10, (angle - 12) / 4);
        } 
        // Far left gets slight fade
        else if (angle < -65) {
          opacity = Math.max(0.25, 1 - (Math.abs(angle) - 65) / 35);
        }
        
        if (Math.abs(angle) < 8) isFocused = true;
        
        el.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotY}deg)`;
        el.style.opacity = opacity;
        el.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
        el.style.pointerEvents = opacity < 0.25 ? 'none' : 'auto';
        el.classList.toggle('focused', isFocused);
        el.style.zIndex = Math.round(1000 + z);
        
        indicators[index].classList.toggle('active', isFocused);
      });
    }

    function snapToPanel(index) {
      targetOffset = -index * ANGLE_SPACING;
      animateToTarget();
    }

    function animateToTarget() {
      const diff = targetOffset - currentOffset;
      if (Math.abs(diff) < 0.5) {
        currentOffset = targetOffset;
        updatePanels();
        return;
      }
      currentOffset += diff * 0.1;
      updatePanels();
      requestAnimationFrame(animateToTarget);
    }

    function snapToNearest() {
      const nearestIndex = Math.round(-currentOffset / ANGLE_SPACING);
      const clampedIndex = Math.max(0, Math.min(panels.length - 1, nearestIndex));
      snapToPanel(clampedIndex);
    }

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || e.touches[0].clientX;
      startOffset = currentOffset;
      document.body.classList.add('dragging');

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const dx = x - startX;
      currentOffset = startOffset + (dx / 7);
      const minOffset = -(panels.length - 1) * ANGLE_SPACING + MAX_LEFT_ANGLE;
      const maxOffset = MAX_RIGHT_ANGLE;
      currentOffset = Math.max(minOffset, Math.min(maxOffset, currentOffset));
      updatePanels();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('dragging');
      snapToNearest();
    }

    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);
    carousel.addEventListener('touchstart', onPointerDown);
    document.addEventListener('touchmove', onPointerMove);
    document.addEventListener('touchend', onPointerUp);

        const nodeLeft = document.createElement('div');
        nodeLeft.className = 'helix-node';

        nodeRight.style.left = xRight + 'px';

          connector.style.left = Math.min(xLeft, xRight) + 5 + 'px';
          connector.style.width = Math.abs(xRight - xLeft) + 'px';
          container.appendChild(connector);
        }
      }

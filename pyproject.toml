
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmmad-receiver"
version = "29.0.0rc1"
description = "Authenticated local authority, persistence, execution, research, and continuity plane for PCMMAD"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3,<4",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["baseline/pcmmad_receiver/.venv", ".pcmmad_gate_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

name: receiver-cleanbox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cleanbox:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Runtime fingerprint
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          python -c "import json, os, platform, sys; print(json.dumps({'executable': sys.executable, 'version': sys.version, 'platform': platform.platform(), 'machine': platform.machine(), 'cpu_count': os.cpu_count()}, indent=2))"
          git rev-parse HEAD
          git status --short --branch
          git rev-parse --is-shallow-repository
      - name: Install declared dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r baseline/pcmmad_receiver/requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Remove operator-local PCMMAD/Python environment
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PCMMAD_*' -or $_.Name -in @('PYTHONPATH','PYTHONHOME','VIRTUAL_ENV') } | ForEach-Object { Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue }
          python -c "import os; assert not any(k.startswith('PCMMAD_') for k in os.environ); print('sanitized environment')"
      - name: Full clean-box suite
        shell: pwsh
        run: |
          python -m pytest -q --tb=short --junitxml=pytest-results.xml *>&1 | Tee-Object -FilePath pytest-output.txt
          $pytestCode = $LASTEXITCODE
          python tools/emit_ci_test_annotations.py pytest-results.xml pytest-output.txt
          $diagnosticCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          if ($diagnosticCode -ne 0) { exit $diagnosticCode }
          exit 0
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ runner.os }}
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Four-worker Windows contention burn
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest -q -n 4 --dist loadscope
          python -m pytest -q -n 4 --dist worksteal
